<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alir</title>
<meta name="theme-color" content="#2747C9">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Halaman perantara: hanya logo + pengalih ke aplikasi Alir. Tidak menyimpan data apa pun.
  var APP = 'https://script.google.com/macros/s/AKfycby2rh_IZlsaiF76LCo7OwM97VTN0RwYsLbfS5yRbAQAY1Ga14OS4JhI3Mo8x6kvkoZW3g/exec';
  var dariPintasan = /[?&]buka=1/.test(location.search) ||
    matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches;
  // Dari pintasan: Alir ditampilkan DI DALAM halaman ini (bingkai), supaya Chrome tidak memunculkan bar alamat
  // script.google.com. Data tetap langsung dari Google ke HP, halaman ini tidak pernah melihatnya.
  // ?langsung=1 = cara lama (pindah ke alamat Google), cadangan kalau bingkai bermasalah.
  // Kalau bingkai pernah gagal di HP ini (mis. login Google tidak terbawa ke bingkai), langsung pakai cara lama.
  // ?bingkai=1 = coba bingkai lagi.
  function ingat(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function baca(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  if (/[?&]bingkai=1/.test(location.search)) ingat('alir-bingkai', null);
  var langsung = /[?&]langsung=1/.test(location.search) || baca('alir-bingkai') === 'gagal';
  if (dariPintasan && langsung) location.replace(APP);
  var bingkai = dariPintasan && !langsung;
</script>
<style>
  :root{--biru:#2747C9;--kuning:#FFC23D}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--biru);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
  img{width:120px;height:120px;filter:drop-shadow(0 16px 32px rgba(5,12,50,.4))}
  h1{margin:20px 0 4px;font-size:44px;letter-spacing:-.03em}
  h1 span{color:var(--kuning)}
  p{margin:0;opacity:.85;max-width:340px}
  a.buka{display:inline-block;margin:28px 0 22px;padding:14px 32px;border-radius:16px;background:var(--kuning);color:#141B2D;font-weight:700;text-decoration:none}
  small{opacity:.7;max-width:340px;display:block}
  iframe.alir{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;visibility:hidden}
  iframe.alir.siap{visibility:visible}
  small a{color:#fff}
</style>
</head>
<body>
<main>
  <img src="ikon-512.png" alt="Logo Alir">
  <h1>alir<span>.</span></h1>
  <p>Pencatat keuangan pribadi</p>
  <a class="buka" id="buka" href="#">Buka Alir</a>
  <small>Pasang di HP: ketuk menu ⋮ di Chrome, lalu pilih <b>Tambahkan ke layar utama</b> atau <b>Instal aplikasi</b>.</small>
</main>
<script>
  // Tombol juga membuka mode bingkai (tanpa pita Google); kalau bingkai pernah gagal di perangkat ini, ?buka=1 otomatis pakai cara lama
  document.getElementById('buka').href = '?buka=1';
  if (bingkai) {
    // Logo di belakang tetap terlihat selama Alir dimuat; kalau bingkai gagal, ada jalan keluar ke cara lama
    document.querySelector('main p').textContent = 'Membuka Alir…';
    document.querySelector('main small').innerHTML = 'Lama tidak muncul? <a href="?langsung=1">Buka langsung</a>';
    document.getElementById('buka').style.display = 'none';
    var f = document.createElement('iframe');
    f.className = 'alir'; f.src = APP; f.title = 'Alir';
    f.allow = 'clipboard-write; web-share';
    document.body.appendChild(f);
    // Bingkai baru ditampilkan setelah Alir mengabari "alir-siap". Kalau bingkai BELUM PERNAH berhasil di perangkat ini
    // dan tidak ada kabar dalam 20 detik (halaman putih / login Google ditolak di bingkai), pindah ke cara lama dan ingat.
    // Kalau sudah pernah berhasil, lambat = server Google baru bangun (mis. sesudah versi baru dipasang): tetap menunggu,
    // tautan "Buka langsung" tetap ada. (Dulu 12 detik lalu langsung diingat gagal → pita Google muncul lagi selamanya.)
    var siap = false, pernahOk = baca('alir-bingkai') === 'ok';
    addEventListener('message', function (e) {
      if (e.data === 'alir-siap' && /(^https:\/\/script\.google\.com$)|-script\.googleusercontent\.com$/.test(e.origin)) {
        siap = true; f.classList.add('siap'); ingat('alir-bingkai', 'ok');
      }
    });
    if (!pernahOk) setTimeout(function () { if (!siap) { ingat('alir-bingkai', 'gagal'); location.replace(APP); } }, 20000);
  }
</script>
</body>
</html>
